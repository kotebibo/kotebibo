name: profile card

on:
  schedule:
    # 04:17 UTC — off the hour, so it isn't queued behind everyone's midnight cron
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # only the inputs. The card itself is an output, so committing it can't
    # retrigger this and spin.
    paths:
      - "scripts/**"
      - "assets/portrait.txt"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/header.svg assets/contributions.json
          if git diff --staged --quiet; then
            echo "card unchanged"
          else
            git commit -m "chore: rebuild profile card"
            git push
          fi
